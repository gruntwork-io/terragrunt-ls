# mise.lock uses lockfile format 4, which older mise versions can't read.
min_version = "2026.11.4"

[tools]
actionlint = "1.7.12"
go = "1.27.4"
golangci-lint = { version = "2.14.0", os = ["linux", "macos"] }
lua = { version = "5.4.7", os = ["linux", "macos"] }
node = "26.13.0"
rust = { version = "1.99.1", components = "clippy,rustfmt", targets = "wasm32-wasip2" }
"go:github.com/goph/licensei/cmd/licensei" = "v0.9.0"
shellcheck = "0.11.0"
# codespell installs through uv into this Python, and mise lock needs both to pin its dependencies.
python = { version = "3.14.10", os = ["linux", "macos"] }
uv = { version = "0.13.7", os = ["linux", "macos"] }
shfmt = { version = "3.13.1", os = ["linux", "macos"] }
tree-sitter = { version = "0.27.2", os = ["linux", "macos"] }
"npm:markdownlint-cli2" = { version = "0.24.0", os = ["linux", "macos"] }
"pipx:codespell" = { version = "2.4.1", os = ["linux", "macos"] }

[tasks."check:actionlint"]
run = "actionlint"

[tasks."check:codespell"]
run = "codespell"

[tasks."check:go-fix"]
run = '''
diff=$(go fix -diff ./...)
if [ -n "$diff" ]; then
  echo "$diff"
  echo "go fix has changes to apply. Run 'go fix ./...' and commit the result." >&2
  exit 1
fi
'''

[tasks."check:go-mod-tidy"]
run = "go mod tidy -diff"

[tasks."check:markdownlint"]
run = "markdownlint-cli2 'docs/**/*.md'"

[tasks."check:shellcheck"]
run = "git ls-files -z '*.sh' | xargs -0 -r shellcheck -x -P SCRIPTDIR"

[tasks."check:shfmt"]
run = "git ls-files -z '*.sh' | xargs -0 -r shfmt -d"

[tasks."check:zed-queries"]
run = ".github/scripts/check-zed-queries.sh"
