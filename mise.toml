[tools]
go = "1.26.2"
golangci-lint = "2.11.4"
# mise installs lua with an asdf plugin, which does not run on Windows.
lua = { version = "5.4.7", os = ["linux", "macos"] }
node = "23.10.0"
rust = "1.85.1"
"go:github.com/goph/licensei/cmd/licensei" = "v0.9.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "v1.9.0"
shellcheck = "0.11.0"
"pipx:codespell" = { version = "2.4.1", os = ["linux", "macos"] }
