version: "2"
run:
  go: "1.26"
  issues-exit-code: 1
  tests: true
output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - contextcheck
    - dupl
    - dupword
    - durationcheck
    - errchkjson
    - errorlint
    - exhaustive
    - fatcontext
    - forbidigo
    - gocheckcompilerdirectives
    - godoclint
    - gochecksumtype
    - goconst
    - gocritic
    - gosmopolitan
    - intrange
    - lll
    - loggercheck
    - makezero
    - misspell
    - mnd
    - modernize
    - musttag
    - nilerr
    - nilnesserr
    - noctx
    - nolintlint
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - protogetter
    - reassign
    - revive
    - rowserrcheck
    - spancheck
    - sqlclosecheck
    - staticcheck
    - testableexamples
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
    - wastedassign
    - wsl_v5
    - zerologlint
  settings:
    dupl:
      threshold: 120
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^testing\.(T|B|F|TB)\.(Error|Errorf|Fatal|Fatalf|Fail|FailNow)$
          pkg: ^testing$
          msg: fail through testify's require or assert instead of the testing.TB failure methods
    errcheck:
      check-type-assertions: false
      check-blank: true
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    goconst:
      # v2.12+ counts package-wide test fixtures; keep repeated test data local.
      # Tracked upstream: https://github.com/golangci/golangci-lint/issues/6563
      ignore-tests: true
      # v2.13+ reports repeated schema/config map keys, which are data rather than constants.
      # Tracked upstream: https://github.com/golangci/golangci-lint/issues/6707
      ignore-map-keys: true
      min-len: 3
      min-occurrences: 5
    gocritic:
      enabled-tags:
        - performance
      disabled-tags:
        - experimental
    govet:
      enable:
        - fieldalignment
        - printf
        - unusedwrite
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: early-return
        - name: indent-error-flow
    staticcheck:
      checks:
        - all
        - -SA9005
        - -QF1008
        - -ST1001
    unparam:
      check-exported: false
    wsl_v5:
      allow-whole-block: false
      branch-max-lines: 2
  exclusions:
    generated: lax
    rules:
      - linters:
          - dupl
          - errcheck
          - mnd
          - unparam
        path: _test\.go
    paths:
      # npm packages can ship Go source (flatted does), and `./...` does not skip node_modules.
      - node_modules
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - goimports
    - golines
  settings:
    gofmt:
      simplify: true
    golines:
      max-len: 120
      tab-len: 1
  exclusions:
    generated: lax
    paths:
      # npm packages can ship Go source (flatted does), and `./...` does not skip node_modules.
      - node_modules
