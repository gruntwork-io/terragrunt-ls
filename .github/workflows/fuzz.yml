name: Fuzz

on:
  schedule:
    # Every day at 07:00 UTC
    - cron: '0 7 * * *'
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up mise
      uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      with:
        version: 2026.11.3
        experimental: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - id: go-cache-paths
      run: |
        echo "go-build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        echo "go-mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

    - id: corpus-week
      run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

    # Restore only, so the fuzz corpus never lands in the build cache that test, lint and build save.
    - name: Go Build Cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.go-cache-paths.outputs.go-build }}
        key: ${{ runner.os }}-go-build-${{ hashFiles('**/go.sum') }}

    - name: Go Mod Cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.go-cache-paths.outputs.go-mod }}
        key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}

    # Keyed by run id, not by commit: main rarely moves, and a key that already
    # exists is never saved again, so a per-commit key would stop the corpus growing.
    # The week in the key starts a new corpus each week. Go replays the corpus inside
    # -fuzztime before it fuzzes, so a corpus that only grows would use up FUZZ_TIME.
    - name: Fuzz Corpus Cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.go-cache-paths.outputs.go-build }}/fuzz
        key: ${{ runner.os }}-fuzz-corpus-${{ steps.corpus-week.outputs.week }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-fuzz-corpus-${{ steps.corpus-week.outputs.week }}-

    - name: Run Fuzz Tests
      run: ./.github/scripts/run-fuzz.sh

    - name: Archive Fuzz Failures
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: fuzz-failures
        path: |
          **/testdata/fuzz/**
