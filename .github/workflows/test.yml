name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  test-os:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}-latest

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos, windows]

    defaults:
      run:
        # Windows defaults to PowerShell, which does not expand $GITHUB_OUTPUT.
        shell: bash

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up mise
      uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      with:
        version: 2025.6.8
        experimental: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - id: go-cache-paths
      run: |
        echo "go-build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        echo "go-mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

    - name: Go Build Cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.go-cache-paths.outputs.go-build }}
        key: ${{ runner.os }}-go-build-${{ hashFiles('**/go.sum') }}

    - name: Go Mod Cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.go-cache-paths.outputs.go-mod }}
        key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}

    - name: Test
      run: go test ./...

  # The main branch ruleset requires a check named test, so this job reports the result of every OS under that name.
  test:
    needs: [test-os]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    steps:
    - name: Check results
      env:
        RESULT: ${{ needs.test-os.result }}
      run: |
        if [[ "$RESULT" != "success" ]]; then
          echo "::error::Tests did not pass on every OS: $RESULT"
          exit 1
        fi
